<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chúc mừng sinh nhật Nguyễn Diệu Linh</title>
  <meta name="description" content="16/9/2003 — hôm nay Linh 23 tuổi. Một món quà nhỏ từ Clu." />
  <meta property="og:title" content="Chúc mừng sinh nhật Nguyễn Diệu Linh" />
  <meta property="og:description" content="16/9/2003 — hôm nay Linh 23 tuổi. Một món quà nhỏ từ Clu." />
  <meta property="og:image" content="cho.png" />
  <link rel="preload" as="image" href="cho.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;1,300&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #12080d;
      --ink: #f7efe6;
      --muted: #d4c0b8;
      --rose: #e8b4b8;
      --gold: #e8c9a0;
      --glow: rgba(232, 180, 184, 0.45);
      --glass: rgba(255, 248, 242, 0.06);
      --line: rgba(232, 201, 160, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }

    .world {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .wash {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(180, 60, 80, 0.28), transparent 55%),
        radial-gradient(800px 500px at 110% 110%, rgba(120, 40, 70, 0.35), transparent 50%),
        radial-gradient(600px 400px at 50% 120%, rgba(232, 201, 160, 0.08), transparent 60%);
    }

    .petal {
      position: absolute;
      top: -24px;
      width: 14px;
      height: 18px;
      background: radial-gradient(circle at 30% 30%, #f3d0d4, #d98a96 70%);
      border-radius: 80% 0 80% 0;
      opacity: 0.45;
      animation: fall linear infinite;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(8, 3, 6, 0.72) 100%);
    }

    .step {
      position: relative;
      z-index: 2;
      width: min(92vw, 560px);
      min-height: 70dvh;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      transform: translateY(18px) scale(0.98);
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .step.on {
      display: flex;
      opacity: 1;
      transform: none;
    }

    .kicker {
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--gold);
      margin-bottom: 18px;
    }

    .line {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.8rem, 6vw, 2.7rem);
      font-weight: 500;
      line-height: 1.35;
      min-height: 3.6em;
      text-shadow: 0 8px 30px rgba(0,0,0,0.45);
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 0.9em;
      margin-left: 4px;
      background: var(--gold);
      vertical-align: -2px;
      animation: blink 0.9s infinite;
    }

    .btn {
      margin-top: 28px;
      appearance: none;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      font-family: inherit;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 14px 28px;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px);
      transition: 0.3s ease;
    }

    .btn.show { opacity: 1; transform: none; }
    .btn:hover {
      background: var(--gold);
      color: #2a1518;
      box-shadow: 0 0 28px var(--glow);
    }

    .gift {
      width: 156px;
      height: 156px;
      object-fit: contain;
      background: #f4eee8;
      padding: 10px;
      border-radius: 50%;
      margin-bottom: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45), 0 0 0 1px var(--line);
    }

    .popper {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .pop-emoji {
      font-size: 6.2rem;
      filter: drop-shadow(0 16px 24px rgba(0,0,0,0.45));
      transition: transform 0.12s ease;
    }

    .hint {
      color: var(--muted);
      letter-spacing: 0.16em;
      font-size: 0.85rem;
      animation: pulse 1.6s infinite;
    }

    .bar {
      width: 220px;
      height: 8px;
      border-radius: 99px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--rose), var(--gold));
      transition: width 0.2s ease;
    }

    .card-wrap { perspective: 1400px; width: 100%; }

    .card {
      background: linear-gradient(180deg, rgba(255,248,242,0.09), rgba(255,248,242,0.03));
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--line);
      border-top-color: rgba(255,255,255,0.22);
      border-radius: 28px;
      padding: 28px 26px 32px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.5);
      transform-style: preserve-3d;
      max-height: 92dvh;
      overflow: auto;
    }

    .card img.cake {
      width: min(220px, 58%);
      display: block;
      margin: 0 auto 8px;
      filter: drop-shadow(0 18px 24px rgba(0,0,0,0.4));
      transform: translateZ(40px);
    }

    .script {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      color: var(--rose);
      line-height: 1.1;
      transform: translateZ(50px);
    }

    .name {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.7rem, 5.4vw, 2.35rem);
      font-weight: 600;
      margin: 6px 0 10px;
      transform: translateZ(50px);
    }

    .meta {
      color: var(--gold);
      letter-spacing: 0.18em;
      font-size: 0.72rem;
      text-transform: uppercase;
      margin-bottom: 16px;
      transform: translateZ(40px);
    }

    .rule {
      width: 72px;
      height: 1px;
      margin: 0 auto 16px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .letter {
      font-size: 1.15rem;
      font-weight: 400;
      line-height: 1.75;
      color: var(--muted);
      max-width: 38ch;
      margin: 0 auto;
      transform: translateZ(30px);
    }

    .sign {
      margin-top: 18px;
      font-family: "Great Vibes", cursive;
      font-size: 1.7rem;
      color: var(--gold);
      transform: translateZ(40px);
    }

    .confetti {
      position: fixed;
      pointer-events: none;
      z-index: 20;
    }

    .music {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 30;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(18,8,13,0.55);
      color: var(--gold);
      cursor: pointer;
      backdrop-filter: blur(10px);
      font-size: 1.05rem;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
      100% { transform: translateY(110dvh) rotate(360deg); opacity: 0.1; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: 0.4; } }
    .shake { animation: shake 0.28s both; }
    @keyframes shake {
      20% { transform: translateX(-6px) rotate(-4deg); }
      40% { transform: translateX(6px) rotate(4deg); }
      60% { transform: translateX(-4px) rotate(-2deg); }
      80% { transform: translateX(4px) rotate(2deg); }
    }

    @media (max-width: 480px) {
      .card { padding: 22px 18px 26px; }
      .letter { font-size: 0.9rem; }
      .pop-emoji { font-size: 5.2rem; }
    }
  </style>
</head>
<body>
  <div class="world">
    <div class="wash"></div>
    <span class="petal" style="left:8%;animation-duration:11s"></span>
    <span class="petal" style="left:22%;animation-duration:14s;animation-delay:-3s;width:10px;height:13px"></span>
    <span class="petal" style="left:41%;animation-duration:12s;animation-delay:-6s"></span>
    <span class="petal" style="left:63%;animation-duration:16s;animation-delay:-2s;width:12px;height:15px;background:radial-gradient(circle at 30% 30%, #f0d7b4, #d4b07a 70%)"></span>
    <span class="petal" style="left:78%;animation-duration:13s;animation-delay:-8s"></span>
    <span class="petal" style="left:91%;animation-duration:15s;animation-delay:-4s;width:9px;height:12px"></span>
    <div class="vignette"></div>
  </div>

  <audio id="song" loop preload="none">
    <source src="hbd.mp3" type="audio/mpeg" />
  </audio>

  <section class="step on" id="s0">
    <img class="gift" src="cho.png" alt="" />
    <p class="kicker">16 · 09 · 2003</p>
    <p class="line">thiệp mừng sinh nhật nè :3</p>
    <button class="btn show" id="start">Mở ra</button>
  </section>

  <section class="step" id="s1">
    <p class="line"><span id="t1"></span><span class="cursor"></span></p>
    <button class="btn" id="b1">Tiếp tục</button>
  </section>

  <section class="step" id="s2">
    <p class="line"><span id="t2"></span><span class="cursor"></span></p>
    <button class="btn" id="b2">Rồi sao?</button>
  </section>

  <section class="step" id="s3">
    <p class="line"><span id="t3"></span><span class="cursor"></span></p>
    <button class="btn" id="b3">tiếp</button>
  </section>

  <section class="step" id="s4">
    <div class="popper" id="popper">
      <div class="pop-emoji" id="pop">🎉</div>
      <p class="hint">Chạm 3 lần để nổ confetti</p>
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>
  </section>

  <section class="step" id="s5">
    <div class="card-wrap">
      <article class="card" id="card">
        <img class="cake" src="cake.jpg" alt="Bánh sinh nhật" loading="lazy" />
        <p class="script">Happy Birthday</p>
        <h1 class="name">Nguyễn Diệu Linh</h1>
        <p class="meta">16.09.2003 &nbsp;·&nbsp; 23 tuổi</p>
        <div class="rule"></div>
        <p class="letter">chúc Linh sinh nhật vui vẻ nhe</p>
      </article>
    </div>
  </section>

  <button class="music" id="music" aria-label="Nhạc" hidden>♪</button>

  <script>
    const song = document.getElementById("song");
    const msgs = [
      "helo Linh!",
      "Hôm nay là 16 tháng 9.",
      "chúc mừng sinh nhậttttt"
    ];
    const colors = ["#e8b4b8", "#e8c9a0", "#ffffff", "#c9a7d6", "#f3d5c0"];

    function go(from, to) {
      const a = document.getElementById("s" + from);
      const b = document.getElementById("s" + to);
      a.classList.remove("on");
      setTimeout(() => {
        a.style.display = "none";
        b.style.display = "flex";
        requestAnimationFrame(() => b.classList.add("on"));
      }, 420);
    }

    function type(id, text, btnId) {
      const el = document.getElementById(id);
      el.textContent = "";
      let i = 0;
      (function tick() {
        if (i < text.length) {
          el.textContent += text.charAt(i++);
          setTimeout(tick, 42);
        } else {
          setTimeout(() => document.getElementById(btnId).classList.add("show"), 280);
        }
      })();
    }

    document.getElementById("start").onclick = () => {
      try { song.volume = 0.45; song.play(); } catch (e) {}
      document.getElementById("music").hidden = false;
      go(0, 1);
      setTimeout(() => type("t1", msgs[0], "b1"), 500);
    };
    document.getElementById("b1").onclick = () => { go(1, 2); setTimeout(() => type("t2", msgs[1], "b2"), 500); };
    document.getElementById("b2").onclick = () => { go(2, 3); setTimeout(() => type("t3", msgs[2], "b3"), 500); };
    document.getElementById("b3").onclick = () => go(3, 4);

    const popper = document.getElementById("popper");
    const pop = document.getElementById("pop");
    const fill = document.getElementById("fill");
    let taps = 0;
    const need = 3;
    popper.onclick = () => {
      if (taps >= need) return;
      taps += 1;
      fill.style.width = (taps * 100 / need) + "%";
      pop.style.transform = "scale(" + (1 + taps * 0.2) + ")";
      popper.classList.remove("shake");
      void popper.offsetWidth;
      popper.classList.add("shake");
      burst(window.innerWidth / 2, window.innerHeight * 0.42, 18);
      if (taps === need) {
        pop.style.transform = "scale(0) rotate(160deg)";
        pop.style.opacity = "0";
        finale();
        setTimeout(() => go(4, 5), 520);
      }
    };

    const card = document.getElementById("card");
    window.addEventListener("mousemove", (e) => {
      if (!document.getElementById("s5").classList.contains("on")) return;
      const x = (window.innerWidth / 2 - e.clientX) / 40;
      const y = (window.innerHeight / 2 - e.clientY) / 40;
      card.style.transform = "rotateY(" + x + "deg) rotateX(" + y + "deg)";
    });

    document.getElementById("music").onclick = () => {
      if (song.paused) { song.play(); document.getElementById("music").textContent = "♪"; }
      else { song.pause(); document.getElementById("music").textContent = "✕"; }
    };

    function burst(x, y, n) {
      for (let i = 0; i < n; i++) {
        const p = document.createElement("div");
        p.className = "confetti";
        const s = 6 + Math.random() * 8;
        p.style.cssText = "left:" + x + "px;top:" + y + "px;width:" + s + "px;height:" + (s * (Math.random() > 0.5 ? 1 : 2.2)) + "px;background:" + colors[i % colors.length] + ";border-radius:" + (Math.random() > 0.4 ? "50%" : "2px");
        document.body.appendChild(p);
        const dx = (Math.random() - 0.5) * 360;
        const dy = -80 - Math.random() * 280;
        p.animate([
          { transform: "translate(0,0) rotate(0)", opacity: 1 },
          { transform: "translate(" + dx + "px," + dy + "px) rotate(" + (Math.random() * 540) + "deg)", opacity: 0 }
        ], { duration: 900 + Math.random() * 700, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" }).onfinish = () => p.remove();
      }
    }

    function finale() {
      const w = window.innerWidth, h = window.innerHeight;
      cannon(-1, w * 0.08, h);
      cannon(1, w * 0.92, h);
      setInterval(() => {
        const p = document.createElement("div");
        p.className = "confetti";
        const s = 5 + Math.random() * 8;
        p.style.cssText = "left:" + (Math.random() * 100) + "vw;top:-16px;width:" + s + "px;height:" + s + "px;background:" + colors[Math.floor(Math.random() * colors.length)] + ";border-radius:50%";
        document.body.appendChild(p);
        p.animate([
          { transform: "translateY(0) rotate(0)" },
          { transform: "translateY(110vh) rotate(720deg)" }
        ], { duration: 3500 + Math.random() * 2500, easing: "linear", fill: "forwards" }).onfinish = () => p.remove();
      }, 380);
    }

    function cannon(dir, x, y) {
      for (let i = 0; i < 70; i++) {
        const p = document.createElement("div");
        p.className = "confetti";
        const s = 6 + Math.random() * 10;
        p.style.cssText = "left:" + x + "px;top:" + y + "px;width:" + s + "px;height:" + (s * 1.6) + "px;background:" + colors[i % colors.length];
        document.body.appendChild(p);
        const ang = (40 + Math.random() * 50) * Math.PI / 180;
        const v = 900 + Math.random() * 900;
        const ex = Math.cos(ang) * v * dir;
        const ey = -Math.sin(ang) * v + 420;
        p.animate([
          { transform: "translate(0,0) rotate(0)", opacity: 1 },
          { transform: "translate(" + ex + "px," + ey + "px) rotate(720deg)", opacity: 0 }
        ], { duration: 1800 + Math.random() * 1200, easing: "cubic-bezier(.2,1,.3,1)", fill: "forwards" }).onfinish = () => p.remove();
      }
    }
  </script>
</body>
</html>
